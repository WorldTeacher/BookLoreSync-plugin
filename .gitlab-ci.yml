stages:
  - build
  - test
  - publish
  - production

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: "$CI_COMMIT_TAG"
    - when: never
# included templates
include:
  # semantic-release template
  - component: "$CI_SERVER_FQDN/to-be-continuous/semantic-release/gitlab-ci-semrel@4.0"
    inputs:
      changelog-enabled: true
      auto-release-enabled: true
    rules:
      - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
        when: always
      - when: never
  - component: "$CI_SERVER_FQDN/to-be-continuous/gitlab-butler/gitlab-ci-butler@1.4"
    inputs:
      pipelines-delete-older-than: "30"

# Build and publish versioned documentation to GitLab Pages
# Replaces the to-be-continuous zola-pages component with a custom job
# that builds all documentation versions (main->latest, develop->dev, tags)
pages:
  stage: publish
  image: alpine:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes: ["docs/**", "scripts/build-versioned-docs.sh"]
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes: ["docs/**", "scripts/build-versioned-docs.sh"]
    - if: "$CI_COMMIT_TAG"
  before_script:
    - apk add --no-cache bash curl git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    # Install Zola static site generator (download to file to avoid
    # pipe truncation with busybox curl | tar on Alpine)
    - ZOLA_VERSION="0.22.1"
    - echo "Installing Zola v${ZOLA_VERSION}..."
    - curl -sL -o /tmp/zola.tar.gz "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-musl.tar.gz"
    - tar xzf /tmp/zola.tar.gz -C /usr/local/bin
    - rm /tmp/zola.tar.gz
    - zola --version
  script:
    - git submodule update --init --recursive
    - mkdir -p public
    - bash scripts/build-versioned-docs.sh
  artifacts:
    paths:
      - public
  publish: public

# The Butler image ships with a binary entrypoint. Clear it so GitLab Runner
# can execute the generated shell wrapper instead of appending it as CLI args
# to `gitlab-butler`.
butler:
  image:
    name: registry.gitlab.com/to-be-continuous/tools/gitlab-butler:latest
    entrypoint: [""]

# Initialize git submodules (required for tanuki theme)
variables:
  GIT_SUBMODULE_STRATEGY: recursive
  ZOLA_WORKSPACE_DIR: "docs"
  GIT_DEPTH: "0"
# secret variables
# (define the variables below in your GitLab group/project variables)
# GITLAB_TOKEN: A GitLab 'project access token' or 'personal access token' with `api`, `read_repository` and `write repository` scopes.
# SEMREL_GPG_SIGNKEY: Path to the GPG signkey exported with `gpg --armor --export-secret-key`.

msgfmt-check:
  stage: test
  image: alpine:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apk add --no-cache gettext
  script:
    - echo "Validating gettext translation files"
    - |
      find "$CI_PROJECT_DIR/bookloresync.koplugin/locale" -name "*.po" | while read po; do
        mo="${po%.po}.mo"
        echo "Compiling $po -> $mo"
        msgfmt "$po" -o "$mo"
      done

lua-tests:
  stage: test
  image: alpine:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apk add --no-cache bash git lua5.4 lua5.4-dev luarocks build-base openssl-dev
    - |
      LUAROCKS_BIN="$(command -v luarocks-5.4 || command -v luarocks)"
      "$LUAROCKS_BIN" --lua-version=5.4 install random || true
      "$LUAROCKS_BIN" --lua-version=5.4 install luasocket
      "$LUAROCKS_BIN" --lua-version=5.4 install luasec
      "$LUAROCKS_BIN" --lua-version=5.4 install busted
      "$LUAROCKS_BIN" --lua-version=5.4 install luacov
      eval "$($LUAROCKS_BIN --lua-version=5.4 path)"
    - |
      cat > /tmp/random.lua <<'EOF'
      local random = {}

      local function pseudo_uuid()
        local template = "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx"
        return (template:gsub("[xy]", function(c)
          local v = math.random(0, 15)
          if c == "y" then
            v = (v % 4) + 8
          end
          return string.format("%x", v)
        end))
      end

      function random.uuid()
        return pseudo_uuid()
      end

      return random
      EOF
      export LUA_PATH="/tmp/?.lua;${LUA_PATH:-;;}"
  script:
    - echo "Running Lua test suite"
    - busted --coverage --output utfTerminal --pattern "_spec%.lua$" test
    - luacov
  artifacts:
    when: always
    paths:
      - luacov.report.out
    expire_in: 10 days

build-koplugin-artifact:
  stage: build
  image: alpine:latest
  rules:
    # Build plugin artifacts only for the develop branch
    - if: '$CI_COMMIT_BRANCH == "develop"'
  before_script:
    - apk add --no-cache zip bash git gettext curl
  script:
    - echo "Generating version information"
    - export PLUGIN_VERSION="dev-build-$(date -u +%Y%m%d%H%M%S)"
    - VERSION_OVERRIDE="$PLUGIN_VERSION" bash scripts/generate-version.sh

    - echo "Compiling gettext translations"
    - |
      find "$CI_PROJECT_DIR/bookloresync.koplugin/locale" -name "*.po" | while read po; do
        mo="${po%.po}.mo"
        echo "Compiling $po -> $mo"
        msgfmt "$po" -o "$mo"
      done

    - echo "Creating koplugin archive"
    - cd "$CI_PROJECT_DIR"
    - zip -r bookloresync.koplugin.zip bookloresync.koplugin/ -x "*.git*" "*.zip"

    - ls -lah "$CI_PROJECT_DIR/bookloresync.koplugin.zip"

    # Upload to package registry as debug-assets/develop for automated testing
    - echo "Uploading build to package registry as debug-assets"
    - |
      PACKAGE_NAME="debug-assets"
      PACKAGE_VERSION="develop"
      PACKAGE_FILE="latest-develop.zip"
      UPLOAD_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${PACKAGE_VERSION}/${PACKAGE_FILE}"

      echo "Upload URL: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${PACKAGE_VERSION}/${PACKAGE_FILE}"

      curl --fail-with-body -L --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file "$CI_PROJECT_DIR/bookloresync.koplugin.zip" \
           "$UPLOAD_URL"

      echo "Package uploaded successfully"

  artifacts:
    name: "bookloresync-$CI_COMMIT_SHORT_SHA"
    paths:
      - bookloresync.koplugin.zip
    expire_in: 10 days

zip-koplugin-release:
  stage: publish
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: "$CI_COMMIT_TAG"
  before_script:
    - apk add --no-cache zip bash git gettext
    # Authenticate glab against your self-hosted instance
    - glab auth login
      --hostname "$CI_SERVER_HOST"
      --job-token "$CI_JOB_TOKEN"
      --api-protocol https
      --git-protocol https
  script:
    - echo "Generating version information from tag $CI_COMMIT_TAG"
    - bash scripts/generate-version.sh

    - echo "Compiling gettext translations"
    - |
      find "$CI_PROJECT_DIR/bookloresync.koplugin/locale" -name "*.po" | while read po; do
        mo="${po%.po}.mo"
        echo "Compiling $po -> $mo"
        msgfmt "$po" -o "$mo"
      done

    - echo "Creating koplugin release archive"
    - cd "$CI_PROJECT_DIR"
    - zip -r bookloresync.koplugin.zip bookloresync.koplugin/ -x "*.git*" "*.zip"

    - ls -lah "$CI_PROJECT_DIR/bookloresync.koplugin.zip"

    # Upload the plugin ZIP
    - >
      glab release upload "$CI_COMMIT_TAG"
      "$CI_PROJECT_DIR/bookloresync.koplugin.zip#bookloresync.koplugin.zip#package"
      --use-package-registry
      -R "$CI_PROJECT_PATH"

    # Upload CHANGELOG.md if it exists
    - |
      if [ -f "CHANGELOG.md" ]; then
        echo "Uploading CHANGELOG.md to release"
        glab release upload "$CI_COMMIT_TAG" \
          "CHANGELOG.md#CHANGELOG.md#other" \
          --use-package-registry \
          -R "$CI_PROJECT_PATH"
      fi

  artifacts:
    paths:
      - bookloresync.koplugin.zip
      - CHANGELOG.md
