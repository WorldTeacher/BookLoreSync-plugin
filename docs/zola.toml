# The URL the site will be built for
base_url = "https://docs.worldteacher.dev/wt-booklore/booklore-koreader-plugin"
title = "Booklore Sync - KOReader Plugin"
description = "Official documentation for the Booklore Sync KOReader plugin. Automatically track reading sessions, sync ratings, highlights, and notes to your self-hosted Booklore server."
theme = "tanuki"
# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

[markdown]
insert_anchor_links = "left"

[extra]
mode = "docs"
gitlab = "https://gitlab.worldteacher.dev/wt-booklore/booklore-koreader-plugin"
show_theme_toggle = true

# Version selector — shows a dropdown to switch between docs versions.
# In CI (GitLab Pages deployment), the build script generates a full version
# list dynamically from git branches (main, develop) and tags.
# The config below is used for local development via `zola serve` and for
# merge-request validation builds.
[extra.versions]
current = "latest"
list = [
    { version = "latest", url = "https://docs.worldteacher.dev/wt-booklore/booklore-koreader-plugin/", label = "latest" },
    { version = "dev", url = "https://docs.worldteacher.dev/wt-booklore/booklore-koreader-plugin/dev/", label = "dev" },
]
